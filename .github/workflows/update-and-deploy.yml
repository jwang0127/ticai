name: Update and deploy lottery dashboard

on:
  workflow_dispatch:
    inputs:
      games:
        description: "要更新的玩法"
        required: true
        default: "dlt,pl3,pl5,fc3d,qxc,ssq,kl8"
        type: choice
        options:
          - "dlt,pl3,pl5,fc3d,qxc,ssq,kl8"
          - "dlt"
          - "pl3,pl5,fc3d,qxc,ssq,kl8"
  schedule:
    # GitHub cron is UTC. Retry after the latest daily draw.
    - cron: "45 13 * * *"
    - cron: "0 14 * * *"
    - cron: "15 14 * * *"
    - cron: "30 14 * * *"
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ticai-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select update scope
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "games=${{ inputs.games }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "games=today" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch official draw history (preserve verified cache on failure)
        run: |
          if [[ "${{ steps.scope.outputs.games }}" == "today" ]]; then
            python src/fetch_draws.py --today --history-limit 2000 --require-fresh-results
          else
            python src/fetch_draws.py --games "${{ steps.scope.outputs.games }}" --history-limit 2000 --require-fresh-results
          fi
      - name: Optimize models with rolling backtests
        run: |
          if [[ "${{ steps.scope.outputs.games }}" == "today" ]]; then
            python src/optimize_models.py --today
          else
            python src/optimize_models.py --games "${{ steps.scope.outputs.games }}"
          fi
      - name: Generate dashboard and copy-ready results
        run: |
          if [[ "${{ steps.scope.outputs.games }}" == "today" ]]; then
            python src/generate_dashboard.py --today
          else
            python src/generate_dashboard.py --games "${{ steps.scope.outputs.games }}"
          fi
      - name: Run regression tests before publish
        run: python -m unittest discover -s tests -v
      - name: Save refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/draws.json docs/assets/data/dashboard.json data/processed/model_reviews.json data/processed/model_tuning.json
          git diff --cached --quiet || git commit -m "chore(data): refresh lottery dashboard"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
