name: Update and deploy lottery dashboard

on:
  workflow_dispatch:
    inputs:
      games:
        description: "要更新的玩法"
        required: true
        default: "dlt,pl3,pl5,fc3d,qxc,ssq,kl8"
        type: choice
        options:
          - "dlt,pl3,pl5,fc3d,qxc,ssq,kl8"
          - "dlt"
          - "pl3,pl5,fc3d,qxc,ssq,kl8"
  # Official lottery endpoints reject GitHub-hosted runner IPs (HTTP 567/403).
  # The Windows scheduled task in scripts/refresh_and_push.ps1 fetches data
  # locally and pushes main; GitHub Actions only builds/deploys that push.
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ticai-pages
  # GitHub can deliver the four retry schedules close together. Cancelling
  # the previous run made every retry disappear while the source was slow.
  # Let retries finish in order so one transient failure cannot erase the
  # only successful attempt.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select update scope
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "games=${{ inputs.games }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "games=today" >> "$GITHUB_OUTPUT"
          else
            echo "games=today" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch official draw history independently per game
        id: refresh
        # A push already contains the locally verified data committed with the
        # change. Keep the strict official freshness gate for scheduled/manual
        # refreshes, but do not let a transient upstream outage block Pages
        # deployment of an already verified commit.
        if: github.event_name != 'push'
        run: |
          if [[ "${{ steps.scope.outputs.games }}" == "today" ]]; then
            python src/refresh_scheduled.py --games due --history-limit 2000
          else
            python src/refresh_scheduled.py --games "${{ steps.scope.outputs.games }}" --history-limit 2000
          fi
      - name: Show refresh checkpoint
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/processed/draws.json')
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              print('source_status=', data.get('source_status'))
              print('updated_at=', data.get('updated_at'))
              print('errors=', data.get('errors', {}))
              for game, rows in data.get('draws', {}).items():
                  if rows:
                      print(f"{game}: issue={rows[0].get('issue')} date={rows[0].get('draw_date')}")
          PY
      - name: Optimize models with rolling backtests
        if: steps.refresh.outputs.games != ''
        run: |
          python src/optimize_models.py --games "${{ steps.refresh.outputs.games }}"
      - name: Generate dashboard and copy-ready results
        if: steps.refresh.outputs.games != ''
        run: |
          python src/generate_dashboard.py --games "${{ steps.refresh.outputs.games }}"
      - name: Run regression tests before publish
        run: python -m unittest discover -s tests -v
      - name: Save refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/draws.json docs/assets/data/dashboard.json data/processed/model_reviews.json data/processed/model_tuning.json
          git diff --cached --quiet || git commit -m "chore(data): refresh lottery dashboard"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
