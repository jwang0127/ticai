<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>兑奖核对｜体彩号码实验室</title>
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="./check.css">
</head>
<body>
  <main class="shell check-shell">
    <header class="check-hero">
      <a class="back-link" href="../">← 返回开奖看板</a>
      <p class="section-label">LOCAL TICKET CHECKER</p>
      <h1>粘贴票面号码，<em>自动核对兑奖</em></h1>
      <p>默认按单倍、基础投注、无追加估算。记录只保存在当前浏览器，不会上传到 GitHub。</p>
    </header>
    <section class="panel date-panel"><label for="draw-date-mode">统一开奖日期</label><select id="draw-date-mode"><option value="auto">自动匹配各彩种下一期开奖</option><option value="today">今天</option><option value="tomorrow">明天</option><option value="custom">自定义日期</option></select><input id="custom-draw-date" type="date" hidden><p class="hint">默认模式会自动处理“今天购买、明天开奖”的大乐透等情况。</p></section>
    <section id="game-checkers" class="game-checkers"></section>
    <section class="panel rules"><h2>使用说明</h2><ul><li>每个彩种单独输入，不同彩种不会混在一起。</li><li>排列3和福彩3D可写“直选”“组选3”“组选6”；快乐8本看板生成选二至选四。</li><li>开奖来源待确认时，只显示待确认，不给出兑奖结论。</li></ul></section>
    <section class="panel"><div class="section-head"><div><p class="section-label">SAVED TICKETS</p><h2>历史记录</h2></div><button id="clear-history" class="ghost" type="button">清空记录</button></div><div id="results" class="results"></div></section>
  </main>
  <script src="./check.js"></script>
</body>
</html>
